name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: rootpw, MYSQL_DATABASE: tms}
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -prootpw" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11
        env: {MARIADB_ROOT_PASSWORD: rootpw, MARIADB_DATABASE: tms}
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pgpw, POSTGRES_DB: tms}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: {ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'Nl2sql!Passw0rd'}
        ports: ['1433:1433']
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env: {ORACLE_PASSWORD: syspw, APP_USER: tms, APP_USER_PASSWORD: tmspw}
        ports: ['1521:1521']
        options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30

    env:
      NL2SQL_TEST_MYSQL_URL: jdbc:mysql://localhost:3306/tms
      NL2SQL_TEST_MYSQL_USER: root
      NL2SQL_TEST_MYSQL_PASSWORD: rootpw
      NL2SQL_TEST_MARIADB_URL: jdbc:mariadb://localhost:3307/tms
      NL2SQL_TEST_MARIADB_USER: root
      NL2SQL_TEST_MARIADB_PASSWORD: rootpw
      NL2SQL_TEST_PG_URL: jdbc:postgresql://localhost:5432/tms
      NL2SQL_TEST_PG_USER: postgres
      NL2SQL_TEST_PG_PASSWORD: pgpw
      NL2SQL_TEST_MSSQL_URL: jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      NL2SQL_TEST_MSSQL_USER: sa
      NL2SQL_TEST_MSSQL_PASSWORD: 'Nl2sql!Passw0rd'
      NL2SQL_TEST_ORACLE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
      NL2SQL_TEST_ORACLE_USER: tms
      NL2SQL_TEST_ORACLE_PASSWORD: tmspw

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Build and test (unit + all six databases)
        run: mvn -B -ntp verify
      - name: Smoke-test the runnable jar
        run: |
          java -jar nl2sql-server/target/nl2sql-*.jar --nl2sql.db.type=sqlite --nl2sql.db.name=/tmp/smoke.db --server.port=18080 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/openapi.yaml | head -3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
