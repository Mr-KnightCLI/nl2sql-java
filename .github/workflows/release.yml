name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Set version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build (unit tests only)
        run: mvn -B -ntp package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=nl2sql-server/target/nl2sql-${GITHUB_REF_NAME#v}.jar
          sha256sum "$JAR" > "$JAR.sha256"
          gh release create "$GITHUB_REF_NAME" "$JAR" "$JAR.sha256" nl2sql.properties.example \
            --title "nl2sql $GITHUB_REF_NAME" --generate-notes
