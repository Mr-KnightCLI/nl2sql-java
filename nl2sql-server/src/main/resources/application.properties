# Built-in defaults. Override them in nl2sql.properties (or the file named by NL2SQL_CONFIG),
# with NL2SQL_* environment variables, or with --property=value arguments.
spring.application.name=nl2sql
spring.config.import=optional:file:${NL2SQL_CONFIG:nl2sql.properties}
spring.main.banner-mode=off

# Listen on this computer only unless configured otherwise (NL2SQL_SERVER_HOST=0.0.0.0 to accept others).
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=INFO
logging.level.com.zaxxer.hikari=WARN
